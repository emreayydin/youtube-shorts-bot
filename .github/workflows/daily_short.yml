name: Daily YouTube Short

on:
  schedule:
    # Stündlich, aber NUR im Tagesfenster 08:00-20:00 UTC (= 10:00-22:00 deutsche
    # Sommerzeit). Vorher lief der Cron rund um die Uhr, und die Selbstdrosselung
    # verteilte die sechs Uploads gleichmäßig — also regelmäßig mitten in der
    # Nacht, wo sie niemand sieht. GitHubs kostenloser Cron überspringt Läufe,
    # deshalb 13 Trigger für 6 Uploads: main.py drosselt selbst (Tageslimit 6,
    # Mindestabstand 2h). Gleiches Muster wie muslim-world-bot.
    - cron: "0 8-20 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Kategorie (leer = zufällig)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (kein Upload)"
        type: boolean
        default: false

permissions:
  contents: write   # allows committing history.json back to the repo

# Shorts und Langvideo schreiben dieselbe history.json. Nie parallel laufen
# lassen, sonst kollidieren die automatischen Update-Commits.
concurrency:
  group: faktisch-history
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate & Upload Short
        working-directory: src
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FAL_KEY: ${{ secrets.FAL_KEY }}   # KI-Bilder; fehlt er, greift Pexels
          # Kostenlos seit 01.10.2026: Texte kommen aus der geprueften Sammlung
          # src/faktenbank.py (woechentlich vom Kanal-Agenten nachgefuellt).
          # Keine bezahlte API. Ist die Sammlung leer, faellt der Slot aus -
          # nie eine Wiederholung.
          ANTHROPIC_ENABLED: "0"
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            ARGS="--category '${{ github.event.inputs.category }}'"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Save history (avoid repeats next run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if [ -d vorrat ]; then git add -A vorrat; fi
          if ! git diff --staged --quiet; then
            git commit -m "Update history [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Upload video artifact (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: output/*.mp4
          retention-days: 7
