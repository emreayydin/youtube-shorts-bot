name: Daily YouTube Short

on:
  schedule:
    # Alle 2 Stunden (12 Trigger/Tag). GitHubs kostenloser Cron überspringt/verzögert
    # Läufe, daher über-planen: main.py drosselt selbst und lädt nur hoch, wenn das
    # Tageslimit (6) noch nicht erreicht ist UND genug Zeit seit dem letzten Upload
    # verging (3h). Ergebnis: ~6 Shorts/Tag zuverlässig, ohne das Quota zu sprengen.
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "Kategorie (leer = zufällig)"
        required: false
        default: ""
      dry_run:
        description: "Dry run (kein Upload)"
        type: boolean
        default: false

permissions:
  contents: write   # allows committing history.json back to the repo

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate & Upload Short
        working-directory: src
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          FAL_KEY: ${{ secrets.FAL_KEY }}   # KI-Bilder; fehlt er, greift Pexels
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.category }}" ]; then
            ARGS="--category '${{ github.event.inputs.category }}'"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python main.py $ARGS

      - name: Save history (avoid repeats next run)
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          if ! git diff --staged --quiet; then
            git commit -m "Update history [skip ci]"
            git pull --rebase --autostash || true
            git push
          fi

      - name: Upload video artifact (dry run only)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short
          path: output/*.mp4
          retention-days: 7
