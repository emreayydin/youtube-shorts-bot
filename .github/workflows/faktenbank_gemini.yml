name: Faktenbank nachfuellen (Gemini)

# Seit 06.10.2026: fuellt montags die Faktensammlung mit Gemini auf, damit
# Emres Mac dafuer nicht laufen muss. Jeder Fakt wird mit Google-Suche
# geschrieben und gegengeprueft (scripts/gemini_kern.py). Kostenlos ueber
# das AI-Studio-Kontingent.
on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      anzahl:
        description: "Hoechstens so viele neue Fakten (leer = bis zum Ziel)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: faktenbank-gemini

jobs:
  nachfuellen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fakten schreiben und pruefen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.anzahl }}" ]; then
            python scripts/faktenbank_nachfuellen.py --anzahl "${{ github.event.inputs.anzahl }}"
          else
            python scripts/faktenbank_nachfuellen.py
          fi
      - name: Speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/faktenbank_neu.py 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "Faktenbank: neue Fakten von Gemini [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 10
            done
          fi
