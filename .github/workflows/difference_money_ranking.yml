name: Difference Money Comparison

on:
  workflow_dispatch:
    inputs:
      comparison_symbol:
        description: "Asset ticker for the historical comparison"
        required: true
        default: ACWI
        type: string
      dry_run:
        description: "Dry run (kein Upload)"
        required: true
        default: true
        type: boolean
      privacy:
        description: "Sichtbarkeit bei echtem Upload"
        required: true
        default: unlisted
        type: choice
        options:
          - unlisted
          - public

permissions:
  contents: read

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHANNEL_MODE: difference_money
      CONTENT_MODE: finance
      COMPARISON_SYMBOL: ${{ inputs.comparison_symbol }}
      TTS_RATE: "+8%"
      YOUTUBE_TOKEN_JSON: ${{ secrets.DIFFERENCE_MONEY_YOUTUBE_TOKEN_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate and optionally upload ranking
        working-directory: src
        env:
          UPLOAD_PRIVACY: ${{ inputs.privacy }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --dry-run
          else
            python main.py
          fi

      - name: Upload dry-run artifact
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: difference-money-${{ inputs.comparison_symbol }}-comparison
          path: output/short_*.mp4
          retention-days: 7
