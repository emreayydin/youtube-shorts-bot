name: Gemini-Zugang testen

# Nur von Hand: prueft, welche Gemini-Modelle mit und ohne Google-Suche
# antworten (scripts/gemini_kern.py). Gibt keinen Schluessel aus.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_PAUSE_SEC: "2"
        run: python scripts/gemini_kern.py
